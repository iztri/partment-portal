{% extends "base.html" %}
{% block title %}{{ code }} · Apartment Portal{% endblock %}

{% block content %}
<div class="card" style="max-width:460px; margin:8vh auto 0;">
  <div class="card-body" style="text-align:center; padding:40px 28px;">
    <div style="font-size:34px; font-weight:700; color:var(--muted);">{{ code }}</div>
    <p class="muted" style="margin:6px 0 18px;">{{ message }}</p>
    <a href="/" class="btn btn-primary btn-sm"><i class="bi bi-house"></i>Back to home</a>
  </div>
</div>
{% endblock %}
